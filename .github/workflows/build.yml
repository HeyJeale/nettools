name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_flag: --mac --arm64
            artifact_name: intl-mac-arm64
            ref: ''
            edition: intl
          - os: windows-latest
            build_flag: --win --x64
            artifact_name: intl-win-x64
            ref: ''
            edition: intl
          - os: macos-latest
            build_flag: --mac --arm64
            artifact_name: en-mac-arm64
            ref: master
            edition: en
          - os: windows-latest
            build_flag: --win --x64
            artifact_name: en-win-x64
            ref: master
            edition: en
          - os: ubuntu-latest
            build_flag: --linux deb --x64
            artifact_name: intl-linux-x64
            ref: ''
            edition: intl
          - os: ubuntu-latest
            build_flag: --linux deb --x64
            artifact_name: en-linux-x64
            ref: master
            edition: en

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Electron app
        run: npx electron-builder ${{ matrix.build_flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename artifacts
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, re, glob

          version_raw = os.popen("node -p \"require('./package.json').version\"").read().strip()
          version = version_raw.replace('-en', '')
          edition = "${{ matrix.edition }}"

          for f in glob.glob('dist-electron/*.dmg') + glob.glob('dist-electron/*.exe') + glob.glob('dist-electron/*.AppImage') + glob.glob('dist-electron/*.deb'):
              base = os.path.basename(f)
              if edition == 'en':
                  # NetTools-1.1.0-en-arm64.dmg -> NetTools-1.1.0-arm64.dmg
                  # NetTools Setup 1.1.0-en.exe  -> NetTools-1.1.0.exe
                  # nettools_1.1.0-en_amd64.deb  -> NetTools-1.1.0-amd64.deb
                  new = re.sub(r'NetTools Setup ([\d.]+-en)\.exe', f'NetTools-{version}.exe', base)
                  new = new.replace(f'-en-', '-').replace(f'-en.', '.')
                  new = re.sub(r'nettools_([\d.]+-en)_amd64\.deb', f'NetTools-{version}-amd64.deb', new)
                  new = re.sub(r'nettools_([\d.]+)_amd64\.deb', f'NetTools-{version}-amd64.deb', new)
              else:
                  # NetTools-1.1.0-arm64.dmg     -> NetTools-1.1.0-intl-arm64.dmg
                  # NetTools Setup 1.1.0.exe      -> NetTools-1.1.0-intl.exe
                  # nettools_1.1.0_amd64.deb      -> NetTools-1.1.0-intl-amd64.deb
                  new = re.sub(r'NetTools Setup ([\d.]+)\.exe', f'NetTools-{version}-intl.exe', base)
                  new = re.sub(rf'NetTools-{re.escape(version)}-arm64', f'NetTools-{version}-intl-arm64', new)
                  new = re.sub(rf'NetTools-{re.escape(version)}\.', f'NetTools-{version}-intl.', new)
                  new = re.sub(r'nettools_([\d.]+)_amd64\.deb', f'NetTools-{version}-intl-amd64.deb', new)
              if new != base:
                  os.rename(f, os.path.join('dist-electron', new))
                  print(f'Renamed: {base} -> {new}')
              else:
                  print(f'Kept: {base}')
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## What's New in ${{ github.ref_name }}

            ### Major Changes
            - **PCAP analyzer rewritten** on top of `tshark` (Wireshark ≥ 4.4) and SQLite
            - Reliable parsing of RTSP / RTP / RTCP / ONVIF / HTTP and 3000+ other protocols
            - Native TCP reassembly, retransmission/out-of-order detection, and HTTP request/response pairing supplied by tshark
            - Filter input now accepts the full **Wireshark display filter syntax** (e.g. `tcp.port == 80`, `http.request.uri contains "onvif"`, `tcp.stream eq 5`)
            - Linux SLL ("cooked") captures and other non-Ethernet link types now decode correctly
            - Large captures stay responsive — packets are stored in SQLite (WAL) instead of in-memory arrays

            ### Bug Fixes
            - HTTP response bodies are now decoded to text instead of showing raw hex
            - Header lists are recovered for reassembled HTTP messages spanning multiple TCP segments
            - Packet detail dialog returns in <300 ms (was 2.5 s for large pcaps)

            ### Downloads
            | File | Platform | Edition |
            |------|----------|---------|
            | `NetTools-1.1.0-arm64.dmg` | macOS (Apple Silicon) | en-US |
            | `NetTools-1.1.0.exe` | Windows x64 (installer) | en-US |
            | `NetTools-1.1.0-amd64.deb` | Ubuntu/Debian x64 | en-US |
            | `NetTools-1.1.0-intl-arm64.dmg` | macOS (Apple Silicon) | Global (EN / 简体中文) |
            | `NetTools-1.1.0-intl.exe` | Windows x64 (installer) | Global (EN / 简体中文) |
            | `NetTools-1.1.0-intl-amd64.deb` | Ubuntu/Debian x64 | Global (EN / 简体中文) |
